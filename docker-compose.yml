name: forge

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # AOF so queued jobs survive a restart (Redis is the job queue from Phase 3 on).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      # n8n keeps its own state in its own Postgres schema-less SQLite by default;
      # we point it at Postgres so everything lives in one place.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-forge}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-forge}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent-layer:
    build: ./agent-layer
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://forge:forge@postgres:5432/forge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-10.00}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_DELAY_SECONDS: ${LLM_RETRY_BASE_DELAY_SECONDS:-2.0}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  generation-worker:
    build: ./agent-layer
    restart: unless-stopped
    # Same image as agent-layer; runs the queue consumer instead of the API.
    command: ["python", "-m", "forge.jobs.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://forge:forge@postgres:5432/forge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-10.00}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_DELAY_SECONDS: ${LLM_RETRY_BASE_DELAY_SECONDS:-2.0}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Migrations run in the agent-layer container; the worker waits for it.
      agent-layer:
        condition: service_healthy

  run-monitor:
    build: ./agent-layer
    restart: unless-stopped
    # Polls n8n executions, ingests runs, diagnoses new failures.
    command: ["python", "-m", "forge.monitor.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://forge:forge@postgres:5432/forge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-10.00}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_DELAY_SECONDS: ${LLM_RETRY_BASE_DELAY_SECONDS:-2.0}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      MONITOR_POLL_SECONDS: ${MONITOR_POLL_SECONDS:-60}
      DIAGNOSTICIAN_AUTO_APPLY: ${DIAGNOSTICIAN_AUTO_APPLY:-true}
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
      agent-layer:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:
